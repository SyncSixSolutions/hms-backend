spring.application.name=apigateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
server.port=0

logging.level.root = INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator = INFO
logging.level.org.springframework.cloud.gateway = TRACE

# Services Service routes
## Food Controller routes
spring.cloud.gateway.routes[0].id=food-services
spring.cloud.gateway.routes[0].uri=lb://services
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/services/meals/**

## Reservation Controller routes
spring.cloud.gateway.routes[1].id=reservation-services
spring.cloud.gateway.routes[1].uri=lb://services
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/services/**

## Vehicle Controller routes
spring.cloud.gateway.routes[2].id=vehicle-services
spring.cloud.gateway.routes[2].uri=lb://services
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/services/vehicle/**

# User Management Service routes
spring.cloud.gateway.routes[3].id=user-management
spring.cloud.gateway.routes[3].uri=lb://userManagement
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/user/**

# Actuator endpoint
management.endpoints.web.exposure.include=prometheus